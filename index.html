<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="./base.css">
    <script defer src="./calculator.js"></script>
</head>
<body>
    <div class="main-container">
        <div class="calculator-body">
            <div class="display-container">
                <div class="display">
                    <div class="display-operation">
                        <span id="display-number-1" class="operation-element operation-element-number">15</span>
                        <span id="display-operator" class="operation-element operation-operator">+</span>
                        <span id="display-number-2" class="operation-element operation-element-number">23</span>
                    </div>
                    <div class="display-result">
                        1234567890
                    </div>
                </div>
            </div>
            <div class="button-container">
                <div class="button-row">
                    <button type="button" class="button button-number button-seven">
                        7
                    </button>
                    <button type="button" class="button button-number button-eight">
                        8
                    </button>
                    <button type="button" class="button button-number button-nine">
                        9
                    </button>
                    <button type="button" class="button button-operator button-divide">
                        /
                    </button>
                </div>
                <div class="button-row">
                    <button type="button" class="button button-number button-four">
                        4
                    </button>
                    <button type="button" class="button button-number button-five">
                        5
                    </button>
                    <button type="button" class="button button-number button-six">
                        6
                    </button>
                    <button type="button" class="button button-operator button-multiply">
                        *
                    </button>
                </div>
                <div class="button-row">
                    <button type="button" class="button button-number button-one">
                        1
                    </button>
                    <button type="button" class="button button-number button-two">
                        2
                    </button>
                    <button type="button" class="button button-number button-three">
                        3
                    </button>
                    <button type="button" class="button button-operator button-subtract">
                        -
                    </button>
                </div>
                <div class="button-row">
                    <button type="button" class="button button-number button-zero">
                        0
                    </button>
                    <button type="button" class="button button-equals">
                        =
                    </button>
                    <button type="button" class="button button-clear">
                        CLEAR
                    </button>
                    <button type="button" class="button button-operator button-add">
                        +
                    </button>
                </div>
            </div>
        </div>
    </div>
    
</body>
</html>
