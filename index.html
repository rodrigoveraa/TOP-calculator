<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="./base.css">
    <script defer src="./calculator.js"></script>
</head>
<body>
    <div class="main-container">
        <div class="calculator-body">
            <div class="display-container">
                <div class="display">

                </div>
            </div>
            <div class="button-container">
                <div class="button-row">
                    <div class="button button-seven">
                        7
                    </div>
                    <div class="button button-eight">
                        8
                    </div>
                    <div class="button button-nine">
                        9
                    </div>
                    <div class="button button-divide">
                        /
                    </div>
                </div>
                <div class="button-row">
                    <div class="button button-four">
                        4
                    </div>
                    <div class="button button-five">
                        5
                    </div>
                    <div class="button button-six">
                        6
                    </div>
                    <div class="button button-multiply">
                        *
                    </div>
                </div>
                <div class="button-row">
                    <div class="button button-one">
                        1
                    </div>
                    <div class="button button-two">
                        2
                    </div>
                    <div class="button button-three">
                        3
                    </div>
                    <div class="button button-subtract">
                        -
                    </div>
                </div>
                <div class="button-row">
                    <div class="button button-zero">
                        0
                    </div>
                    <div class="button button-result">
                        =
                    </div>
                    <div class="button button-clear">
                        CLEAR
                    </div>
                    <div class="button button-add">
                        +
                    </div>
                </div>
            </div>
        </div>
    </div>
    
</body>
</html>
